services:
  pi:
    build:
      context: .
    image: ${PI_DOCKER_IMAGE:?由 pi-docker 命令设置}
    init: true
    security_opt:
      - no-new-privileges:true
    entrypoint: ["sleep", "infinity"]
    environment:
      PUID: ${PUID:?由 pi-docker 命令设置}
      PGID: ${PGID:?由 pi-docker 命令设置}
      PI_GROUPS: ${PI_GROUPS:?由 pi-docker 命令设置}
      PI_CODING_AGENT_SESSION_DIR: ${PI_SESSION_DIR:?由 pi-docker 命令设置}
    volumes:
      - type: bind
        source: ./data
        target: /home/node/.pi/agent
        bind:
          create_host_path: false
      - type: bind
        source: ${PI_WORKSPACE:?由 pi-docker 命令设置}
        target: /workspace
        bind:
          create_host_path: false
