[program:demo]
command=/usr/bin/setpriv --reuid=app-demo --regid=app-demo --clear-groups --no-new-privs --inh-caps=-all --ambient-caps=-all --bounding-set=-all -- /srv/app-services/apps/demo/venv/bin/python3 /srv/app-services/apps/demo/code/server.py
directory=/srv/app-services/apps/demo/code
environment=HOME="/srv/app-services/apps/demo",USER="app-demo",LOGNAME="app-demo",HOST="127.0.0.1",PORT="20000",APP_DATA_DIR="/srv/app-services/apps/demo/data",PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
startsecs=1
startretries=3
stopasgroup=true
killasgroup=true
stopwaitsecs=10
stdout_logfile=/srv/app-services/apps/demo/logs/stdout.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
stderr_logfile=/srv/app-services/apps/demo/logs/stderr.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=2
