# Live Pi processes persist when all clients disconnect. No resurrect plugin is
# used: after a container/host restart, recover Pi history instead of pretending
# the old process survived.
set -g destroy-unattached off
set -g exit-empty on
set -g remain-on-exit off
set -g history-limit 20000
set -g default-terminal tmux-256color
# Pi requests modified-key reporting. CSI-u is available in tmux 3.5+ (the image);
# keep older developer/CI tmux usable without forcing an outer capability.
set -g extended-keys on
if-shell -F '#{extended-keys-format}' 'set -g extended-keys-format csi-u'
set -g mouse on
set -g set-clipboard off
set -g allow-passthrough off
set -g status-left ' Pi in Container | '
set -g status-right ' #S | detach: C-b d '
set -g status-style 'bg=colour235,fg=colour152'
set -g automatic-rename off
