# Include from the host Nginx http{} context, alongside existing virtual hosts.
# Reuse your existing certificate, Cloudflare real-IP and connection_upgrade map.
# Application hosts (app-demo.example.com, etc.) need DNS/certificate coverage.
# A *.example.com DNS record/certificate can cover them; app-* is NOT a DNS wildcard.
# Change the zone and fixed loopback port here if necessary; no per-app edits.
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name "~^app-[a-z0-9](?:[a-z0-9-]{0,57}[a-z0-9])?\.example\.com$";

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        client_max_body_size 100m;
    }
}
