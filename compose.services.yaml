services:
  services:
    build:
      context: .
      dockerfile: services/Dockerfile
    image: ${DEPLOY_IMAGE:?由 devctl 命令设置}
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      DEPLOY_PUBLIC_URL: ${DEPLOY_PUBLIC_URL:-}
    ports:
      - "127.0.0.1:${DEPLOY_PORT:-18080}:8080"
    volumes:
      - type: bind
        source: ${DEPLOY_DATA_DIR:?设置服务持久化目录}
        target: /srv/app-services
        bind:
          create_host_path: false
    networks:
      deployments:
        aliases: [app-services]
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:http').get('http://127.0.0.1:9000/healthz',r=>{r.resume();process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
    stop_grace_period: 30s

networks:
  deployments:
    name: ${DEPLOY_NETWORK:?由 devctl 命令设置}
