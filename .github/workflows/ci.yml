name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install ShellCheck, Nginx and OpenSSH for real-tool regressions
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck nginx openssh-client
      - name: Check scripts and run isolated tests
        run: bash scripts/check.sh
      - name: Test entrypoint identity in a disposable root filesystem
        run: sudo "$(command -v node)" --test tests/entrypoint.test.mjs

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build images and test SSH deployment, gateway and durable recovery
        run: bash tests/docker-smoke.sh
