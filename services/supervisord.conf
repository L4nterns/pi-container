[unix_http_server]
file=/run/app-services/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
pidfile=/run/app-services/supervisord.pid
logfile=/dev/stdout
logfile_maxbytes=0
childlogdir=/run/app-services

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/app-services/supervisor.sock

[program:sshd]
priority=10
stopwaitsecs=5
stopasgroup=true
killasgroup=true
command=/usr/sbin/sshd -D -e -f /opt/app-services/sshd_config
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
priority=10
stopwaitsecs=5
stopasgroup=true
killasgroup=true
command=/usr/sbin/nginx -c /opt/app-services/nginx.conf -g "daemon off;"
autorestart=true
stopsignal=QUIT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[include]
files=/srv/app-services/supervisor/*.conf
